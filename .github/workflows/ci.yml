name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --manifest-path linux/Cargo.toml -- --check
      - run: cargo clippy --manifest-path linux/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path linux/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: spenblet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
